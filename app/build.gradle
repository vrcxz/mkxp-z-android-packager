plugins {
    id 'com.android.application'
}

def targetAbis = (project.findProperty('targetAbis') ?: 'arm64-v8a').toString().split(',').toList()
if (targetAbis.any { !(it in ['arm64-v8a', 'armeabi-v7a']) }) {
    throw new GradleException('targetAbis must contain arm64-v8a and/or armeabi-v7a')
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        applicationId "com.hatkid.mkxpz"
        minSdk 23
        targetSdk 33
        versionCode 13
        versionName "0.1.3"
        archivesBaseName = "mkxp-z-$versionName"
        ndk.debugSymbolLevel = 'FULL'
        externalNativeBuild {
            ndkBuild {
                abiFilters.addAll(targetAbis)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*targetAbis)
            universalApk(targetAbis.size() > 1)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'

    // Audio-stripped variant: built with `./gradlew assembleDebug -PstripAudio`.
    // Excludes the game's bundled Audio tree from the APK.
    aaptOptions {
        if (project.hasProperty('stripAudio')) {
            ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!Audio"
        }
    }
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
